type: xpdata
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg
  stability:
    development: [traces, metrics, logs, profiles]

feature_gates:
  - id: pdata.cow
    description: 'When enabled, the fanout consumer uses copy-on-write semantics for pdata sharing instead of eager deep-cloning at the fanout boundary. The deep-clone is deferred to the first mutating call by any downstream consumer (the detach), so read-only fanout branches incur zero allocations. Independent of pdata.enableRefCounting (this gate uses a separate cowRefs counter on pdata State). See perf/rfc/pdata-cow.md for the full design.'
    stage: alpha
    from_version: 'v1.61.0'
    reference_url: 'https://github.com/open-telemetry/opentelemetry-collector/issues/13631'
  - id: pdata.enableRefCounting
    description: 'When enabled, enables using ref counting to know when pdata memory can be freed up. This featuregate is here only to protect if unexpected bugs happens because of ref counting logic.'
    stage: beta
    from_version: 'v0.133.0'
    reference_url: 'https://github.com/open-telemetry/opentelemetry-collector/issues/13631'
